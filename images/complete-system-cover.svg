<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="ÉLAN CLINIC — The Complete System cover">
  <defs>
    <style>
      :root{--navy:#1a2332;--gold:#c9a96e;--white:#ffffff;}
      .bg{fill:var(--navy);} 
      .gold{fill:var(--gold);} 
      .stroke-gold{stroke:var(--gold);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none;}
      .stroke-white{stroke:var(--white);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.95;}
      .kicker{font: 600 28px/1.1 system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif; letter-spacing: .22em;}
      .title{font: 800 82px/1.05 system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif; letter-spacing: .01em;}
      .author{font: 600 30px/1.1 system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif; opacity:.92;}
      .badgeText{font: 800 28px/1 system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif; letter-spacing:.08em;}
      .subtle{opacity:.18;}
    </style>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a96e" stop-opacity=".30"/>
      <stop offset="1" stop-color="#c9a96e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="720"/>
  <circle cx="1060" cy="130" r="390" fill="url(#glow)"/>
  <path class="subtle" d="M0,610 C250,535 420,680 660,605 C900,530 1040,650 1280,575 L1280,720 L0,720 Z" fill="#ffffff"/>

  <text x="80" y="96" class="kicker" fill="#ffffff">ÉLAN CLINIC</text>

  <!-- Icon: package/bundle -->
  <g transform="translate(840 235)">
    <path d="M70 130 L220 60 L370 130 L220 200 Z" class="stroke-gold"/>
    <path d="M70 130 L70 300 L220 380 L220 200" class="stroke-gold"/>
    <path d="M370 130 L370 300 L220 380" class="stroke-gold"/>
    <path d="M220 60 L220 200" class="stroke-white"/>
    <path d="M145 95 L295 165" class="stroke-white" opacity=".75"/>
  </g>

  <text x="80" y="330" class="title" fill="#ffffff">The Complete</text>
  <text x="80" y="420" class="title" fill="#ffffff">System</text>

  <text x="80" y="650" class="author" fill="#ffffff">Dr. Ingmar Lindström, MD</text>

  <g transform="translate(1030 560)">
    <rect x="0" y="0" width="190" height="74" rx="16" class="gold"/>
    <text x="95" y="48" text-anchor="middle" class="badgeText" fill="#1a2332">PRICE</text>
  </g>
</svg>
