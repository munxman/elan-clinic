  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <rect x="56" y="56" width="1168" height="608" fill="none" stroke="#c9a96e" stroke-width="3" opacity="0.75"/>
  <rect x="78" y="78" width="1124" height="564" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.35"/>

  <text x="96" y="120" fill="#ffffff" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="34" font-weight="700" letter-spacing="6">ÉLAN CLINIC</text>
  <line x1="96" y1="140" x2="420" y2="140" stroke="#c9a96e" stroke-width="3" opacity="0.9"/>

  <!-- Price badge -->
  <g transform="translate(1040 72)" filter="url(#softShadow)">
    <rect x="0" y="0" rx="18" ry="18" width="168" height="64" fill="#c9a96e"/>
    <text x="84" y="43" text-anchor="middle" fill="#1a2332" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="30" font-weight="800">€49</text>
  </g>

  <!-- Icon: Shield -->
  <g transform="translate(170 230)" filter="url(#softShadow)">
    <path d="M120 22 L210 58 V150 C210 214, 170 256, 120 288 C70 256, 30 214, 30 150 V58 Z" fill="none" stroke="#c9a96e" stroke-width="6"/>
    <path d="M120 60 V238" stroke="#ffffff" stroke-width="5" opacity="0.75" stroke-linecap="round"/>
    <path d="M72 132 H168" stroke="#ffffff" stroke-width="5" opacity="0.75" stroke-linecap="round"/>
    <path d="M70 92 C92 78, 112 72, 120 70 C128 72, 148 78, 170 92" fill="none" stroke="#c9a96e" stroke-width="4" opacity="0.8"/>
  </g>

  <!-- Title -->
  <text x="640" y="350" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="78" font-weight="800">Beyond the Medication</text>
  <text x="640" y="400" text-anchor="middle" fill="#c9a96e" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="22" font-weight="600" letter-spacing="2">THE LONG-TERM SUCCESS PLAYBOOK</text>

