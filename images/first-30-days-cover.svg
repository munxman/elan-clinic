<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="ÉLAN CLINIC — The First 30 Days cover">
  <defs>
    <style>
      :root{--navy:#1a2332;--gold:#c9a96e;--white:#ffffff;}
      .bg{fill:var(--navy);} 
      .gold{fill:var(--gold);} 
      .stroke-gold{stroke:var(--gold);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none;}
      .stroke-white{stroke:var(--white);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.95;}
      .kicker{font: 600 28px/1.1 system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif; letter-spacing: .22em;}
      .title{font: 800 84px/1.05 system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif; letter-spacing: .01em;}
      .author{font: 600 30px/1.1 system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif; opacity:.92;}
      .badgeText{font: 800 28px/1 system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif; letter-spacing:.08em;}
      .subtle{opacity:.18;}
    </style>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a96e" stop-opacity=".30"/>
      <stop offset="1" stop-color="#c9a96e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="720"/>
  <circle cx="1040" cy="130" r="360" fill="url(#glow)"/>
  <path class="subtle" d="M0,590 C220,520 420,640 640,570 C860,500 1040,590 1280,520 L1280,720 L0,720 Z" fill="#ffffff"/>

  <!-- Header -->
  <text x="80" y="96" class="kicker" fill="#ffffff">ÉLAN CLINIC</text>

  <!-- Icon: calendar + check -->
  <g transform="translate(830 230)">
    <rect x="0" y="0" width="320" height="300" rx="28" class="stroke-gold"/>
    <line x1="0" y1="70" x2="320" y2="70" class="stroke-gold"/>
    <line x1="80" y1="-10" x2="80" y2="90" class="stroke-gold"/>
    <line x1="240" y1="-10" x2="240" y2="90" class="stroke-gold"/>
    <path d="M95 170 L145 220 L235 135" class="stroke-white"/>
    <!-- dots -->
    <g fill="#c9a96e" opacity=".85">
      <circle cx="70" cy="120" r="6"/><circle cx="120" cy="120" r="6"/><circle cx="170" cy="120" r="6"/><circle cx="220" cy="120" r="6"/><circle cx="270" cy="120" r="6"/>
    </g>
  </g>

  <!-- Title -->
  <text x="80" y="330" class="title" fill="#ffffff">The First</text>
  <text x="80" y="420" class="title" fill="#ffffff">30 Days</text>

  <!-- Author -->
  <text x="80" y="650" class="author" fill="#ffffff">Dr. Ingmar Lindström, MD</text>

  <!-- Price badge (blank price; can be edited later) -->
  <g transform="translate(1030 560)">
    <rect x="0" y="0" width="190" height="74" rx="16" class="gold"/>
    <text x="95" y="48" text-anchor="middle" class="badgeText" fill="#1a2332">PRICE</text>
  </g>
</svg>
