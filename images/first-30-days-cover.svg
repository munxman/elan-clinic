<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="ÉLAN CLINIC — The First 30 Days">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#0f1622"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Gold frame accents -->
  <rect x="56" y="56" width="1168" height="608" fill="none" stroke="#c9a96e" stroke-width="3" opacity="0.75"/>
  <rect x="78" y="78" width="1124" height="564" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.35"/>

  <!-- Top brand -->
  <text x="96" y="120" fill="#ffffff" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="34" font-weight="700" letter-spacing="6">ÉLAN CLINIC</text>
  <line x1="96" y1="140" x2="420" y2="140" stroke="#c9a96e" stroke-width="3" opacity="0.9"/>

  <!-- Price badge (top-right) -->
  <g transform="translate(1040 72)" filter="url(#softShadow)">
    <rect x="0" y="0" rx="18" ry="18" width="168" height="64" fill="#c9a96e"/>
    <text x="84" y="43" text-anchor="middle" fill="#1a2332" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="30" font-weight="800">€19</text>
  </g>

  <!-- Icon: Calendar -->
  <g transform="translate(160 220)" opacity="0.98" filter="url(#softShadow)">
    <rect x="0" y="0" width="240" height="240" rx="26" fill="none" stroke="#c9a96e" stroke-width="6"/>
    <rect x="0" y="0" width="240" height="64" rx="26" fill="#c9a96e" opacity="0.18"/>
    <line x1="60" y1="18" x2="60" y2="66" stroke="#c9a96e" stroke-width="10" stroke-linecap="round"/>
    <line x1="180" y1="18" x2="180" y2="66" stroke="#c9a96e" stroke-width="10" stroke-linecap="round"/>
    <!-- grid dots -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="70" cy="110" r="6"/>
      <circle cx="120" cy="110" r="6"/>
      <circle cx="170" cy="110" r="6"/>
      <circle cx="70" cy="150" r="6"/>
      <circle cx="120" cy="150" r="6"/>
      <circle cx="170" cy="150" r="6"/>
      <circle cx="70" cy="190" r="6"/>
      <circle cx="120" cy="190" r="6"/>
      <circle cx="170" cy="190" r="6"/>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(0 0)">
    <text x="640" y="370" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="78" font-weight="800">The First 30 Days</text>
    <text x="640" y="420" text-anchor="middle" fill="#c9a96e" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="22" font-weight="600" letter-spacing="2">A PRACTICAL STARTER PLAN</text>
  </g>

  <!-- Bottom author -->
  <line x1="96" y1="596" x2="1184" y2="596" stroke="#c9a96e" stroke-width="2" opacity="0.45"/>
  <text x="96" y="644" fill="#ffffff" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="26" font-weight="600" opacity="0.92">Dr. Ingmar Lindström, MD</text>

</svg>
