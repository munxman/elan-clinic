<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="ÉLAN CLINIC — The GLP-1 Nutrition Gap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#0f1622"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <rect x="56" y="56" width="1168" height="608" fill="none" stroke="#c9a96e" stroke-width="3" opacity="0.75"/>
  <rect x="78" y="78" width="1124" height="564" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.35"/>

  <text x="96" y="120" fill="#ffffff" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="34" font-weight="700" letter-spacing="6">ÉLAN CLINIC</text>
  <line x1="96" y1="140" x2="420" y2="140" stroke="#c9a96e" stroke-width="3" opacity="0.9"/>

  <!-- Price badge -->
  <g transform="translate(1040 72)" filter="url(#softShadow)">
    <rect x="0" y="0" rx="18" ry="18" width="168" height="64" fill="#c9a96e"/>
    <text x="84" y="43" text-anchor="middle" fill="#1a2332" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="30" font-weight="800">€29</text>
  </g>

  <!-- Icon: Plate + leaf -->
  <g transform="translate(160 240)" filter="url(#softShadow)">
    <!-- plate -->
    <circle cx="120" cy="120" r="108" fill="none" stroke="#c9a96e" stroke-width="6"/>
    <circle cx="120" cy="120" r="74" fill="#ffffff" opacity="0.06" stroke="#c9a96e" stroke-width="4"/>
    <!-- fork/knife hint -->
    <line x1="28" y1="70" x2="28" y2="170" stroke="#c9a96e" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <line x1="212" y1="70" x2="212" y2="170" stroke="#c9a96e" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <!-- leaf -->
    <path d="M140 70 C190 75, 206 118, 176 154 C150 186, 106 178, 102 132 C98 90, 120 72, 140 70 Z" fill="#c9a96e" opacity="0.55"/>
    <path d="M116 152 C140 136, 166 112, 184 88" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="640" y="350" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="72" font-weight="800">The GLP-1 Nutrition Gap</text>
  <text x="640" y="400" text-anchor="middle" fill="#c9a96e" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="22" font-weight="600" letter-spacing="2">WHAT MOST PLANS MISS</text>

  <line x1="96" y1="596" x2="1184" y2="596" stroke="#c9a96e" stroke-width="2" opacity="0.45"/>
  <text x="96" y="644" fill="#ffffff" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Arial" font-size="26" font-weight="600" opacity="0.92">Dr. Ingmar Lindström, MD</text>
</svg>
